<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Status Tracker</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 800px;
      text-align: left;
    }
    h1 {
      text-align: center;
    }
    .add-stage {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .add-stage input {
      padding: 0.5rem;
      font-size: 1.2rem;
      border: 2px solid #ddd;
      border-radius: 5px;
      width: 60%;
      margin-right: 0.5rem;
    }
    .add-stage button {
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .milestones {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .milestone {
      padding: 1.5rem;
      background: #f8f9fa;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      font-size: 1.4rem;
    }
    .milestone.completed {
      background: #d4edda;
      color: #155724;
    }
    .status {
      padding: 0.7rem 1.2rem;
      background: #6c757d;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
      font-size: 1rem;
    }
    .status:hover {
      background: #5a6268;
    }
    .remarks {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 0.7rem;
      font-size: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Research Milestones Tracker</h1>
    <div class="add-stage">
      <input type="text" id="newStage" placeholder="Add a new stage">
      <button onclick="addStage()">➕ Add Stage</button>
    </div>
    <div class="milestones" id="milestonesContainer"></div>
  </div>

  <script>
    let milestones = JSON.parse(localStorage.getItem('milestones')) || [
      { name: "🔍 Guide Identification", completed: false, remarks: "" },
      { name: "📚 Research field selection", completed: false, remarks: "" },
      { name: "📖 Coursework subject selection", completed: false, remarks: "" },
    ];

    function saveMilestones() {
      localStorage.setItem('milestones', JSON.stringify(milestones));
    }

    function renderMilestones() {
      const milestonesContainer = document.getElementById('milestonesContainer');
      milestonesContainer.innerHTML = '';
      milestones.forEach((milestone, index) => {
        const milestoneElement = document.createElement('div');
        milestoneElement.classList.add('milestone');
        if (milestone.completed) milestoneElement.classList.add('completed');
        milestoneElement.innerHTML = `
          <span>${index + 1}. ${milestone.name}</span>
          <textarea class="remarks" placeholder="Add remarks..." oninput="updateRemarks(${index}, this.value)">${milestone.remarks}</textarea>
          <div class="status" onclick="toggleCompletion(${index})">${milestone.completed ? 'Completed' : 'Pending'}</div>
        `;
        milestonesContainer.appendChild(milestoneElement);
      });
    }

    function toggleCompletion(index) {
      milestones[index].completed = !milestones[index].completed;
      saveMilestones();
      renderMilestones();
    }

    function updateRemarks(index, value) {
      milestones[index].remarks = value;
      saveMilestones();
    }

    function addStage() {
      const newStageInput = document.getElementById('newStage');
      const newStage = newStageInput.value.trim();
      if (newStage) {
        milestones.push({ name: `🆕 ${newStage}`, completed: false, remarks: "" });
        saveMilestones();
        renderMilestones();
        newStageInput.value = '';
      } else {
        alert('Please enter a valid stage name.');
      }
    }

    renderMilestones();
  </script>
</body>
</html>
