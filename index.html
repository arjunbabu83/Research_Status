<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Status Tracker</title>
  <style>
    /* General Styles */
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 800px;
      text-align: left;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: #444;
      text-align: center;
    }

    .add-stage {
      margin-bottom: 2rem;
      text-align: center;
    }

    .add-stage input {
      padding: 0.5rem;
      font-size: 1.2rem;
      border: 2px solid #ddd;
      border-radius: 5px;
      width: 60%;
      margin-right: 0.5rem;
    }

    .add-stage button {
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .add-stage button:hover {
      background: #218838;
    }

    .milestones {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .milestone {
      padding: 1.5rem;
      background: #f8f9fa;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      font-size: 1.4rem;
    }

    .milestone.completed {
      background: #d4edda;
      color: #155724;
    }

    .milestone.completed .status {
      background: #28a745;
    }

    .milestone .status {
      padding: 0.7rem 1.2rem;
      background: #6c757d;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
      display: inline-block;
      margin-top: 10px;
      font-size: 1rem;
    }

    .milestone .status:hover {
      background: #5a6268;
    }

    .remarks {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 0.7rem;
      font-size: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    @media (max-width: 600px) {
      .container {
        width: 95%;
        padding: 1rem;
      }
      .add-stage input {
        width: 70%;
      }
      .milestone {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Research Milestones Tracker</h1>
    <div class="add-stage">
      <input type="text" id="newStage" placeholder="Add a new stage">
      <button onclick="addStage()">➕ Add Stage</button>
    </div>
    <div class="milestones">
      <!-- Milestones will be dynamically added here -->
    </div>
  </div>

  <script>
    const milestones = [
      "🔍 Guide Identification",
      "📚 Research field selection",
      "📖 Coursework subject selection",
      "✅ Coursework completion",
      "📝 Comprehensive exam completion",
      "🎯 Research objectives finalization",
      "🛡️ Proposal defence exam",
      "📰 1st paper publication",
      "📜 2nd paper publication",
      "🎤 Open seminar to the audience",
      "📑 Synopsis submission",
      "🏆 Thesis defence",
      "📕 Thesis submission",
      "🎓 Degree awarding"
    ];

    function renderMilestones() {
      const milestonesContainer = document.querySelector('.milestones');
      milestonesContainer.innerHTML = '';

      milestones.forEach((milestone, index) => {
        const milestoneElement = document.createElement('div');
        milestoneElement.classList.add('milestone');
        milestoneElement.innerHTML = `
          <span>${index + 1}. ${milestone}</span>
          <textarea class="remarks" placeholder="Add remarks..."></textarea>
          <div class="status" onclick="toggleCompletion(this)">Pending</div>
        `;
        milestonesContainer.appendChild(milestoneElement);
      });
    }

    function toggleCompletion(element) {
      const milestone = element.parentElement;
      if (element.textContent === 'Pending') {
        element.textContent = 'Completed';
        milestone.classList.add('completed');
      } else {
        element.textContent = 'Pending';
        milestone.classList.remove('completed');
      }
    }

    function addStage() {
      const newStageInput = document.getElementById('newStage');
      const newStage = newStageInput.value.trim();
      if (newStage) {
        milestones.push(`🆕 ${newStage}`);
        renderMilestones();
        newStageInput.value = '';
      } else {
        alert('Please enter a valid stage name.');
      }
    }

    renderMilestones();
  </script>
</body>
</html>
